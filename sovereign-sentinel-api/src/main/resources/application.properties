spring.application.name=sovereign-sentinel
server.port=${PORT:8080}

# H2 persists to a file on your laptop. Cloud containers can lose local files on restart.
spring.datasource.url=jdbc:h2:file:./data/sentinel;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Local default is DEMO ONLY; set SENTINEL_API_KEY on any public deployment.
sentinel.api-key=${SENTINEL_API_KEY:local-demo-key}
sentinel.scheduler.interval-ms=60000
sentinel.heartbeat.hours=24
sentinel.cors.allowed-origins=${SENTINEL_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Traffic monitoring configuration
sentinel.traffic.max-requests=30
sentinel.traffic.window-seconds=60

